[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessbot-tools"
version = "0.8.0"
description = "Validation and experiment tools for the ChessBot C++ engine"
requires-python = ">=3.12"
dependencies = ["python-chess==1.999"]

[project.optional-dependencies]
dev = ["cmake>=3.24,<5", "ninja>=1.11,<2", "clang-format==21.1.8", "numpy>=1.26,<3"]
analysis = ["numpy>=1.26,<3", "pandas>=2.2,<4", "matplotlib>=3.8,<4", "pyarrow>=15"]
training = ["torch>=2.2,<3", "numpy>=1.26,<3", "pandas>=2.2,<4", "pyarrow>=15"]

[tool.setuptools]
packages = []
