name: Learning campaign

on:
  workflow_dispatch:
    inputs:
      config:
        description: Versioned learning-cycle configuration
        required: true
        default: data/training/phase10-config-v1.json

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[training]'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - name: Run immutable learning cycle
        run: python tools/learning_cycle.py --config "${{ inputs.config }}" --engine build/chessbot --output-dir build/learning-cycle
      - name: Test learning-cycle safeguards
        run: python tools/test_learning_cycle.py --engine build/chessbot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-cycle-${{ github.sha }}
          path: build/learning-cycle
          if-no-files-found: error
          retention-days: 30
